<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marktzettel</title>
<meta name="description" content="Gemeinsame Einkaufsliste und Rezeptsammlung für euren Haushalt, mit Sync und Benachrichtigungen.">
<meta name="theme-color" content="#1B7A4B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF2EC; --surface:#FFFFFF; --ink:#16211B; --muted:#5B6B61; --line:#D5DDD3;
  --accent:#1B7A4B; --accent-ink:#FFFFFF; --accent-soft:#DDEFE4; --saffron:#E9A21B;
  --danger:#B3261E; --field:#F7F9F5;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512; --surface:#18211C; --ink:#E7EFE9; --muted:#98A89E; --line:#2A3830;
    --accent:#4CC48A; --accent-ink:#06170E; --accent-soft:#1D3327; --saffron:#F0B43E;
    --danger:#F2867E; --field:#131B16;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512; --surface:#18211C; --ink:#E7EFE9; --muted:#98A89E; --line:#2A3830;
  --accent:#4CC48A; --accent-ink:#06170E; --accent-soft:#1D3327; --saffron:#F0B43E;
  --danger:#F2867E; --field:#131B16;
}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin-inline:auto;padding-block:14px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px;position:sticky;top:0;background:var(--bg);z-index:6}
.brand{font-family:var(--display);font-weight:800;font-size:1.65rem;letter-spacing:-.02em;line-height:1}
.sync{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);font-weight:600;background:none;border:0;padding:6px 4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.dot.off{background:var(--saffron)}
h2{font-family:var(--display);font-weight:800;letter-spacing:-.015em;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.banner.warn{background:#F6E3C4;color:#3A2E14}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .banner.warn{background:#3A2E14;color:#F6E3C4}
}
:root[data-theme="dark"] .banner.warn{background:#3A2E14;color:#F6E3C4}

/* Einkauf */
.addbar{display:flex;gap:8px;position:sticky;top:56px;z-index:5;background:var(--bg);padding-block:6px 10px}
.addbar input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;min-height:38px;font-size:.88rem;border-radius:12px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.progress{display:flex;align-items:center;gap:10px;margin:4px 0 16px;font-size:.88rem;color:var(--muted);font-weight:600}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.group{margin-bottom:18px}
.group>h3{padding-bottom:6px}
.list{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{width:16px;height:16px;opacity:0}
.chk.on svg{opacity:1}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.done .name{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:1px}
.qty{flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;background:var(--accent-soft);border-radius:8px;padding:3px 8px}
.iconbtn{flex:none;border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:19px;height:19px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:1.2rem;color:var(--ink);margin-bottom:4px}

/* Rezepte */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.head h2{font-size:1.5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.card .t{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.card .m{font-size:.84rem;color:var(--muted);margin-top:auto}
.tag{display:inline-block;font-size:.74rem;font-weight:700;background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.tag.ex{background:transparent;border:1px dashed var(--saffron);color:var(--muted)}

.detail h2{font-size:1.9rem;margin:6px 0 8px}
.back{border:0;background:transparent;padding:8px 8px 8px 0;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px}
.back svg{width:18px;height:18px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.stepper button{border:0;background:transparent;width:44px;height:44px;font-size:1.3rem;font-weight:700}
.stepper span{min-width:110px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.section{margin-top:22px}
.section>h3{margin-bottom:8px}
.ing .row{cursor:pointer}
.ing .row.onlist .name::after{content:" · auf der Liste";font-weight:500;font-size:.78rem;color:var(--accent)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);font-weight:700;font-size:.85rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.steps li.on{opacity:.5}
.steps li.on span{text-decoration:line-through}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.sticky-cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;margin-top:16px}
.sticky-cta .btn{width:100%;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.link{color:var(--accent);font-weight:600;overflow-wrap:anywhere}

/* Formular */
.form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label{font-weight:700;font-size:.86rem}
.field small{color:var(--muted)}
.field input,.field textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.field textarea{min-height:120px;resize:vertical}
.import{background:var(--accent-soft);border-radius:16px;padding:14px;display:grid;gap:10px}
.import textarea{background:var(--field);min-height:90px}
.two{display:grid;grid-template-columns:1fr 110px;gap:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs div{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav.tabs button{border:0;background:transparent;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.78rem;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--saffron);color:#1a1200;border-radius:999px;font-size:.68rem;padding:0 6px;min-width:18px;line-height:18px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:20;max-width:calc(100% - 32px)}

/* Kategorien, Sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,14,11,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:75vh;overflow:auto}
.sheet-list{display:grid;gap:8px}
.sheet-item{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--field);border-radius:12px;padding:12px 14px;font-weight:600}
.sheet-item svg{width:17px;height:17px;color:var(--accent);flex:none}
.sheet-item.on{border-color:var(--accent);background:var(--accent-soft)}
.aisle-row{gap:8px}
.aisle-name{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-weight:600}
.aisle-btns{display:flex;gap:4px;flex:none}
.aisle-btns .iconbtn:disabled{opacity:.3}
.hint{font-size:.86rem;color:var(--muted);margin:0 0 12px}
.switch{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.switch input{position:absolute;opacity:0;width:38px;height:22px;margin:0;cursor:pointer}
.switch .track{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}

/* Onboarding & Einstellungen */
.onboard{min-height:calc(100vh - 28px);display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:24px}
.onboard .brand{font-size:2.1rem}
.choice{display:grid;gap:12px}
.choice .card{gap:6px}
.choice .card .t{font-size:1.05rem}
.codebox{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:.08em;background:var(--accent-soft);border-radius:14px;padding:16px;text-align:center;user-select:all}
.settings-block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;margin-bottom:16px}
.settings-block .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.status-line{display:flex;align-items:center;gap:8px;font-size:.9rem}
.status-line .dot{width:8px;height:8px}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="iconbtn" id="listsbtn" data-act="lists-open" aria-label="Listen" hidden style="background:var(--accent-soft);color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg></button>
      <div class="brand">Marktzettel</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="btn small" id="invite" data-act="open-invite" aria-label="Person zum Haushalt einladen" hidden>Einladen</button>
      <button class="sync" id="sync" data-act="open-settings" aria-label="Einstellungen und Sync-Status"><span class="dot off"></span><span>Lädt…</span></button>
    </div>
  </header>
  <div id="banner"></div>
  <div id="addhost"></div>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" hidden><div>
  <button id="tab-list" data-act="tab" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>Einkauf<span class="badge" id="badge" hidden></span></button>
  <button id="tab-rec" data-act="tab" data-tab="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5V21.5M9 8h7M9 12h5"/></svg>Rezepte</button>
</div></nav>
<div id="toast" class="toast" hidden></div>
<div id="sheethost"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getMessaging, isSupported, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js";

const CONFIG = window.MARKTZETTEL_CONFIG || {};
const fb = CONFIG.firebase || {};
const configured = !!(fb.apiKey && fb.projectId && String(fb.apiKey).indexOf('DEIN_') !== 0);

let resolveReady;
window.MZFirebaseReady = new Promise((res) => { resolveReady = res; });
window.MZFirebase = {
  configured,
  db: null,
  fns: { doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, getDocs },
  getFcmToken: async () => null,
};

(async () => {
  if (!configured) { resolveReady({ ok: false, error: 'not_configured' }); return; }
  let app, db;
  try {
    app = initializeApp(fb);
    db = getFirestore(app);
    window.MZFirebase.db = db;
    resolveReady({ ok: true });
  } catch (e) {
    resolveReady({ ok: false, error: String(e) });
    return;
  }
  try {
    if (await isSupported()) {
      const messaging = getMessaging(app);
      window.MZFirebase.getFcmToken = async (reg) => {
        try { return await getToken(messaging, { vapidKey: CONFIG.vapidKey, serviceWorkerRegistration: reg }); }
        catch (e) { return null; }
      };
      onMessage(messaging, (payload) => {
        const body = (payload.notification && payload.notification.body) || 'Liste aktualisiert';
        if (window.MZOnPush) window.MZOnPush(body);
      });
    }
  } catch (e) { /* Push ist optional */ }
})();
</script>

<script>
(function(){
"use strict";
const ICON={

  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>',
  archive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;margin-left:2px"><path d="M8 5l8 7-8 7"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg>'
};
const DEFAULT_AISLES=[
  ['obst','Obst & Gemüse'],['brot','Backwaren'],['kuehl','Kühlregal'],['fleisch','Fleisch & Fisch'],
  ['vorrat','Vorrat & Gewürze'],['getraenke','Getränke'],['haushalt','Haushalt'],['sonst','Sonstiges']
].map(([key,label])=>({key,label}));
// Reihenfolge zählt: spezifische Vorratsartikel vor Obst und Kühlregal. "*" = Wortende.
const RULES=[
  ['vorrat',['kokos','tomatenmark','passiert','nudel','pasta','spaghetti','penne','reis','mehl','zucker','*öl','essig','linsen','kichererbsen','bohnen','haferflocken','müsli','nuss','nüsse','mandel','salz','pfeffer','paprikapulver','kreuzkümmel','curry','zimt','brühe','sojasauce','honig','senf','ketchup','mayo','couscous','bulgur','backpulver','vanille','schokolade','gewürz','oregano','thymian','lorbeer','dose','tahini','cornflakes','semmelbrösel','stärke']],
  ['getraenke',['wasser','saft','bier','wein','cola','kaffee','tee','limo','sekt']],
  ['haushalt',['spülmittel','toilettenpapier','müllbeutel','waschmittel','küchenpapier','tabs','schwamm','zahnpasta','seife','alufolie','backpapier']],
  ['brot',['brot','brötchen','toast','baguette','tortilla','fladen','croissant','wrap']],
  ['fleisch',['hähnchen','hühnchen','huhn','rind','hack','schwein','lachs','fisch','wurst','schinken','speck','salami','garnele','thunfisch','pute','steak','filet']],
  ['kuehl',['milch','joghurt','*käse','käse','butter','sahne','quark','ei','eier','mozzarella','parmesan','feta','schmand','frischkäse','skyr','margarine','tofu','creme','mascarpone','ricotta','hefe','halloumi']],
  ['obst',['apfel','äpfel','banane','tomate','gurke','zwiebel','knoblauch','kartoffel','karotte','möhre','paprika','zitrone','salat','spinat','brokkoli','zucchini','pilz','champignon','lauch','ingwer','petersilie','basilikum','avocado','beere','orange','limette','kürbis','aubergine','sellerie','koriander','minze','dill','schnittlauch','chili','birne','traube','mango','ananas','rucola','kohl','fenchel','rosmarin','salbei','erbsen','mais']]
];
function aisleOf(name){
  const toks=String(name).toLowerCase().split(/[^a-zäöüß]+/).filter(Boolean);
  for(const [key,kws] of RULES){
    for(const kw of kws){
      const end=kw[0]==='*', k=end?kw.slice(1):kw;
      for(const t of toks){ if(end? t.endsWith(k) : (k.length<=3 ? t===k||t===k+'er'||t===k+'e' : t.startsWith(k)) ) return key; }
    }
  }
  return 'sonst';
}
const UNITS='gramm|liter|kg|mg|g|ml|cl|dl|l|el|tl|stk\\.?|stück|prisen?|prise|pck\\.?|packungen?|dosen?|bund|bündel|zehen?|scheiben?|becher|gläser|glas|handvoll';
const LINE_RE=new RegExp('^(\\d+(?:[.,]\\d+)?(?:\\s*/\\s*\\d+)?|[½¼¾⅓⅔])\\s*(?:-\\s*\\d+(?:[.,]\\d+)?\\s*)?('+UNITS+')?(?=\\s|$)\\s*(.*)$','i');
function toNum(s){
  const map={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
  if(map[s]!=null) return map[s];
  if(/\//.test(s)){const [a,b]=s.split('/').map(x=>parseFloat(x.replace(',','.')));return b?a/b:a;}
  return parseFloat(s.replace(',','.'));
}
const UNIT_NORM={'gramm':'g','liter':'l','stk.':'Stk','stk':'Stk','stück':'Stk','el':'EL','tl':'TL','prisen':'Prise','prise':'Prise','pck.':'Pck','pck':'Pck','packung':'Pck','packungen':'Pck','dosen':'Dose','dose':'Dose','bund':'Bund','bündel':'Bund','zehen':'Zehe','zehe':'Zehe','scheiben':'Scheibe','scheibe':'Scheibe','gläser':'Glas','glas':'Glas','becher':'Becher','handvoll':'Handvoll'};
function parseLine(raw){
  let s=String(raw).replace(/^[\s\-•*·–]+/,'').trim();
  if(!s) return null;
  const m=LINE_RE.exec(s);
  if(m && m[3] && m[3].trim()){
    const q=toNum(m[1]); let u=(m[2]||'').toLowerCase();
    u=UNIT_NORM[u]||u;
    return {name:m[3].trim().replace(/^(von|an)\s+/i,''),qty:isFinite(q)?q:null,unit:u};
  }
  return {name:s,qty:null,unit:''};
}
function fmtNum(n){ return Number(n).toLocaleString('de-DE',{maximumFractionDigits:2}); }
function fmtQty(q,u){ return q==null?'':(fmtNum(q)+(u?' '+u:'')); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function host(u){ try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';} }
function safeUrl(u){ try{const x=new URL(u); return (x.protocol==='https:'||x.protocol==='http:')?x.href:'';}catch(e){return '';} }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function randomCode(){
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // ohne verwechselbare Zeichen
  let s=''; for(let i=0;i<8;i++) s+=abc[Math.floor(Math.random()*abc.length)];
  return s;
}

function fsCol(path){ const M=window.MZFirebase; return M.fns.collection(M.db, basePath()+'/'+path); }

async function put(coll,id,data){ await window.MZFirebase.fns.setDoc(fsDoc(coll+'/'+id), data); }
async function patch(coll,id,data){ await window.MZFirebase.fns.updateDoc(fsDoc(coll+'/'+id), data); }

// ---------- Einkaufsliste ----------
function normKey(n,u){ return String(n).toLowerCase().trim()+'|'+(u||'').toLowerCase(); }
function resolveAisle(i){ const k=i&&i.aisle; return (k && S.aisles.some(a=>a.key===k)) ? k : 'sonst'; }
async function addItem(p,recipeTitle){
  if(!S.listId) return 'notready';
  const name=p.name.trim(); if(!name) return 'skip';
  const key=normKey(name,p.unit);
  const ex=S.items.find(i=>!i.done&&normKey(i.name,i.unit)===key);
  if(ex){
    const recipes=Array.from(new Set([...(ex.recipes||[]),...(recipeTitle?[recipeTitle]:[])]));
    if(ex.qty!=null && p.qty!=null){
      await patchItem(ex.id,{qty:Math.round((ex.qty+p.qty)*100)/100,recipes,by:S.deviceId}); return 'merged';
    }
    if(recipeTitle && recipes.length!==(ex.recipes||[]).length) await patchItem(ex.id,{recipes,by:S.deviceId});
    return 'merged';
  }
  const id=uid();
  const guess=aisleOf(name);
  const aisle=S.aisles.some(a=>a.key===guess)?guess:'sonst';
  await putItem(id,{name,qty:p.qty==null?null:p.qty,unit:p.unit||'',aisle,done:false,recipes:recipeTitle?[recipeTitle]:[],by:S.deviceId,at:Date.now()});
  return 'added';
}

// ---------- Kategorien ----------
function slugKey(label){
  let base=label.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  if(!base) base='kategorie';
  let k=base,i=2; while(S.aisles.some(a=>a.key===k)){ k=base+'-'+(i++); }
  return k;
}
async function saveAisles(){
  if(S.dbOk){ await safe(put('meta','aisles',{list:S.aisles})); }
  refresh(true);
}
function moveAisle(key,dir){
  const ix=S.aisles.findIndex(a=>a.key===key); if(ix<0) return;
  const nx=ix+dir; if(nx<0||nx>=S.aisles.length) return;
  const t=S.aisles[ix]; S.aisles[ix]=S.aisles[nx]; S.aisles[nx]=t;
  saveAisles();
}
async function deleteAisle(key){
  if(key==='sonst') return;
  const affected=S.items.filter(i=>i.aisle===key);
  for(const it of affected){ await safe(patchItem(it.id,{aisle:'sonst'})); }
  S.aisles=S.aisles.filter(a=>a.key!==key);
  await saveAisles();
}

// ---------- Listen ----------
// Neue Haushalte bekommen sofort eine Standardliste "Einkauf". Haushalte, die
// noch Artikel aus der alten, flachen Struktur (households/{code}/items/*)
// haben, werden einmalig in diese Standardliste umgezogen. meta/migration
// verhindert, dass das bei jedem Connect erneut passiert.
async function ensureDefaultList(){
  const M=window.MZFirebase;
  try{
    const migSnap=await M.fns.getDoc(fsDoc('meta/migration'));
    if(migSnap.exists()) return;
    const [oldSnap,listsSnap]=await Promise.all([M.fns.getDocs(fsCol('items')),M.fns.getDocs(fsCol('lists'))]);
    if(listsSnap.empty){
      const defId='default';
      await put('lists',defId,{name:'Einkauf',order:0,archived:false,createdAt:Date.now()});
      if(!oldSnap.empty){
        for(const d of oldSnap.docs){ await M.fns.setDoc(M.fns.doc(M.db,basePath()+'/lists/'+defId+'/items/'+d.id),d.data()); }
      }
    }
    if(!oldSnap.empty){
      for(const d of oldSnap.docs){ await M.fns.deleteDoc(d.ref); }
    }
    await put('meta','migration',{done:true,at:Date.now()});
  }catch(e){ /* Best effort, wird beim nächsten Connect erneut versucht */ }
}
function onLists(list){
  S.lists=list;
  const active=list.filter(l=>!l.archived).sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0));
  let pick=null;
  if(S.listId && list.some(l=>l.id===S.listId && !l.archived)) pick=S.listId;
  else if(active.length) pick=active[0].id;
  if(pick && pick!==S.listId) selectList(pick);
  else if(!pick){ S.listId=null; S.items=[]; }
  refresh(true);
}
function selectList(id){
  if(id===S.listId){ refresh(true); return; }
  S.listId=id; S.items=[]; saveIdentity();
  if(unsubItems){ try{unsubItems();}catch(e){} unsubItems=null; }
  if(S.dbOk){
    const M=window.MZFirebase;
    unsubItems=M.fns.onSnapshot(fsListCol('items'), snap=>onItems(snap.docs.map(d=>({id:d.id,...d.data()}))), ()=>setSync(false,'Sync unterbrochen'));
  }
  refresh(true);
}
async function createList(name){
  const trimmed=(name||'').trim(); if(!trimmed) return;
  const id=uid();
  const order=S.lists.reduce((m,l)=>Math.max(m,l.order||0),-1)+1;
  await safe(put('lists',id,{name:trimmed,order,archived:false,createdAt:Date.now()}));
  selectList(id);
}
async function renameList(id,name){
  const trimmed=(name||'').trim(); if(!trimmed) return;
  await safe(patch('lists',id,{name:trimmed}));
}
async function archiveList(id,archived){
  await safe(patch('lists',id,{archived}));
}
async function deleteListPermanently(id){
  const M=window.MZFirebase;
  const itemsSnap=await M.fns.getDocs(fsCol('lists/'+id+'/items'));
  for(const d of itemsSnap.docs){ await safe(M.fns.deleteDoc(d.ref)); }
  await safe(drop('lists',id));
  if(S.listId===id) S.listId=null;
}
function moveListOrder(id,dir){
  const arr=S.lists.filter(l=>!l.archived).sort((a,b)=>(a.order||0)-(b.order||0));
  const ix=arr.findIndex(l=>l.id===id); if(ix<0) return;
  const nx=ix+dir; if(nx<0||nx>=arr.length) return;
  const a=arr[ix],b=arr[nx];
  safe(patch('lists',a.id,{order:b.order||0}));

}

function heuristicParse(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out={title:'',servings:2,ingredients:[],steps:[]};
  for(const l of lines){
    const cleaned=l.replace(/^[#@]\S+\s*/,'');
    if(!out.title && l.length<80 && !LINE_RE.test(l)) { out.title=l.replace(/[#@]\S+/g,'').trim(); continue; }
    const m=LINE_RE.exec(l.replace(/^[\s\-•*·–]+/,''));
    if(m && l.length<70) { const p=parseLine(l); if(p) out.ingredients.push(p); }
    else if(/^\d+[.)]\s+/.test(l)) out.steps.push(l.replace(/^\d+[.)]\s+/,''));
    else if(l.length>=45 && !/^#/.test(cleaned)) out.steps.push(l);
  }
  return out;
}
function doParse(){
  const text=$('f-paste').value.trim();
  if(!text){ toast('Bitte zuerst einen Text einfügen.'); return; }
  const res=heuristicParse(text);
  if(res.title) $('f-title').value=res.title;
  if(res.servings) $('f-serv').value=Math.max(1,Math.round(res.servings));
  $('f-ing').value=ingText(res.ingredients);
  $('f-steps').value=(res.steps||[]).join('\n');
  toast(res.ingredients.length?'Übernommen. Bitte kurz prüfen.':'Keine Zutaten erkannt. Bitte von Hand ergänzen.');
}

  if(ex&&ex.example) data.example=true;

function copyText(text,doneMsg,label){
  const done=()=>toast(doneMsg);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done,label));
  } else fallbackCopy(text,done,label);
}
function copyCode(code){ copyText(code,'Code kopiert.','den Code'); }
function fallbackCopy(text,done,label){
  try{
    const inp=document.createElement('input'); inp.value=text; inp.style.position='fixed'; inp.style.opacity='0';
    document.body.appendChild(inp); inp.select(); document.execCommand('copy'); document.body.removeChild(inp); done();
  }catch(e){ toast('Bitte '+(label||'den Text')+' von Hand kopieren: '+text); }
}

}
function renderInviteSheet(){
  if(!S.inviteOpen) return '';
  const members=memberNames();
  return '<div class="sheet-backdrop" data-act="invite-close">'+
    '<div class="sheet">'+
      '<h3 style="margin-bottom:0">Person einladen</h3>'+
      '<p class="hint" style="margin:4px 0 0">Teile den Code oder Link – auf dem anderen Handy dann auf „Bestehendem Haushalt beitreten“ tippen (oder den Link direkt öffnen).</p>'+
      '<div class="codebox" style="margin-top:6px">'+esc(S.code)+'</div>'+
      '<div class="actions" style="margin-top:0">'+
        '<button class="btn" data-act="invite-share">Einladung teilen</button>'+
        '<button class="btn ghost small" data-act="copy-code" data-code="'+esc(S.code)+'">Nur Code kopieren</button>'+
      '</div>'+
      (members.length?('<div><div class="lbl">Schon dabei</div><div class="hint" style="margin:4px 0 0">'+esc(members.join(', '))+'</div></div>'):'')+
      '<button class="btn ghost small" data-act="invite-close">Schließen</button>'+
    '</div></div>';
}
function leaveHousehold(){
  try{ localStorage.removeItem('mz_code'); }catch(e){}
  location.reload();
}

// ---------- Onboarding-Abschluss & Start ----------
async function finishOnboarding(name){
  S.myName=name||''; saveIdentity();
  S.tab='list'; S.view={t:'list'};
  await startHouseholdSync();
  if(S.dbOk){ await safe(put('devices',S.deviceId,{name:S.myName,updatedAt:Date.now()})); }
  refresh(true);
}
async function enablePush(){
  if(!('serviceWorker' in navigator) || !('Notification' in window)){ toast('Push wird auf diesem Gerät nicht unterstützt.'); return; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('Berechtigung nicht erteilt.'); refresh(true); return; }
    const reg=await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    const token=await window.MZFirebase.getFcmToken(reg);
    if(!token){ toast('Kein Push-Token erhalten. Ist alles in config.js eingetragen?'); return; }
    await safe(patch('devices',S.deviceId,{token,updatedAt:Date.now()}).catch(()=>put('devices',S.deviceId,{name:S.myName,token,updatedAt:Date.now()})));
    S.pushEnabled=true; toast('Benachrichtigungen aktiviert.'); refresh(true);
  }catch(e){ toast('Benachrichtigungen konnten nicht aktiviert werden.'); }
}
function onItems(list){ S.items=list; setSync(true,'Live synchron'); refresh(); }
function onRecipes(list){ S.recipes=list; refresh(); }
function onDevices(list){
  S.names={}; list.forEach(d=>{ S.names[d.id]=d.name||''; });
  refresh();
}
async function startHouseholdSync(){
  unsubHousehold.forEach(u=>{ try{u();}catch(e){} });
  unsubHousehold=[];
  if(unsubItems){ try{unsubItems();}catch(e){} unsubItems=null; }
  const ready=await window.MZFirebaseReady;
  if(!ready.ok){
    S.dbOk=false;
    setSync(false,'Nur auf diesem Gerät');
    $('banner').innerHTML='<div class="banner warn">config.js ist noch nicht ausgefüllt. Die App läuft ohne Synchronisierung. Siehe README.md.</div>';
    return;
  }
  S.dbOk=true;
  const M=window.MZFirebase;
  const err=()=>{ setSync(false,'Sync unterbrochen'); };
  await ensureDefaultList();
  try{
    unsubHousehold.push(M.fns.onSnapshot(fsCol('lists'), snap=>onLists(snap.docs.map(d=>({id:d.id,...d.data()}))), err));
    unsubHousehold.push(M.fns.onSnapshot(fsCol('recipes'), snap=>onRecipes(snap.docs.map(d=>({id:d.id,...d.data()}))), err));
    unsubHousehold.push(M.fns.onSnapshot(fsCol('devices'), snap=>onDevices(snap.docs.map(d=>({id:d.id,...d.data()}))), err));
    unsubHousehold.push(M.fns.onSnapshot(fsDoc('meta/aisles'), snap=>{
      if(snap.exists()){ const l=snap.data().list; if(Array.isArray(l)&&l.length) S.aisles=l; }
      refresh();
    }, err));
    setSync(false,'Verbinde…');
  }catch(e){ setSync(false,'Sync unterbrochen'); }
}
function inviteCodeFromUrl(){
  try{
    const p=new URLSearchParams(location.search);
    return (p.get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  }catch(e){ return ''; }
}
function stripInviteCodeFromUrl(){
  try{
    const u=new URL(location.href);
    if(!u.searchParams.has('code')) return;
    u.searchParams.delete('code');
    history.replaceState(null,'',u.pathname+(u.search?u.search:'')+u.hash);
  }catch(e){}
}
async function boot(){
  loadIdentity();
  const linkCode=inviteCodeFromUrl();
  if(S.code){
    S.tab='list'; S.view={t:'list'};
    refresh(true);
    await startHouseholdSync();
    refresh(true);
  } else if(linkCode){
    S.view={t:'onboard',mode:'join',prefillCode:linkCode};
    refresh(true);
    setTimeout(()=>{ const n=$('ob-name'); if(n) n.focus(); },0);
  } else {
    S.view={t:'onboard',mode:'choice'};
    refresh(true);
  }
  stripInviteCodeFromUrl();
}
// Beim erneuten Öffnen der App (z. B. vom Home-Bildschirm, nach dem die
// PWA im Hintergrund pausiert war) soll wieder die Einkaufsliste zu sehen
// sein, unabhängig davon, welche Unterseite zuletzt offen war.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && S.code && S.view.t!=='onboard' && S.view.t!=='list'){
    S.tab='list';
    go({t:'list'});
  }
});
boot();
})();
</script>
